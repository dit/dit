name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR or branch supersedes runs still queued for older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: every OS on the newest Python, plus all versions on macOS (the fastest runner).
        # Pushes to main and manual runs: the full OS x Python matrix.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"os": "ubuntu-latest", "python-version": "3.14"},
          {"os": "windows-latest", "python-version": "3.14"},
          {"os": "macos-latest", "python-version": "3.11"},
          {"os": "macos-latest", "python-version": "3.12"},
          {"os": "macos-latest", "python-version": "3.13"},
          {"os": "macos-latest", "python-version": "3.14"}
          ]' || '[
          {"os": "ubuntu-latest", "python-version": "3.11"},
          {"os": "ubuntu-latest", "python-version": "3.12"},
          {"os": "ubuntu-latest", "python-version": "3.13"},
          {"os": "ubuntu-latest", "python-version": "3.14"},
          {"os": "windows-latest", "python-version": "3.11"},
          {"os": "windows-latest", "python-version": "3.12"},
          {"os": "windows-latest", "python-version": "3.13"},
          {"os": "windows-latest", "python-version": "3.14"},
          {"os": "macos-latest", "python-version": "3.11"},
          {"os": "macos-latest", "python-version": "3.12"},
          {"os": "macos-latest", "python-version": "3.13"},
          {"os": "macos-latest", "python-version": "3.14"}
          ]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Pin Python version for uv
        run: echo '${{ matrix.python-version }}' > .python-version

      # ECOS (the broja extra) enables BROJA's exact cone solver, which builds from source
      # where ecos has no wheel (Python 3.13+). Windows runs without it, so the admUI
      # fallback that installs without ECOS use stays tested end to end. sympy (the symbolic
      # extra) is needed by tests/symbolic, which skip without it.
      - name: Install package and dependencies
        run: uv sync --extra test --extra optional --extra symbolic ${{ runner.os != 'Windows' && '--extra broja' || '' }}

      # Coverage on the newest Python of every OS; Codecov merges the three reports, so
      # code that runs only with ECOS (Linux, macOS) or without it (Windows) is counted.
      - name: Run tests
        env:
          COVERAGE_CORE: sysmon
        run: >-
          uv run pytest
          ${{ matrix.python-version == '3.14' && '--cov-report=xml' || '--no-cov' }}

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          name: ${{ matrix.os }}-python${{ matrix.python-version }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra dev

      - name: Type check with ty
        run: uv run ty check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra docs

      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
