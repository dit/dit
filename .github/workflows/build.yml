name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR or branch supersedes runs still queued for older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: every OS on the newest Python, plus all versions on macOS (the fastest runner).
        # Pushes to main and manual runs: the full OS x Python matrix.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"os": "ubuntu-latest", "python-version": "3.14"},
          {"os": "windows-latest", "python-version": "3.14"},
          {"os": "macos-latest", "python-version": "3.11"},
          {"os": "macos-latest", "python-version": "3.12"},
          {"os": "macos-latest", "python-version": "3.13"},
          {"os": "macos-latest", "python-version": "3.14"}
          ]' || '[
          {"os": "ubuntu-latest", "python-version": "3.11"},
          {"os": "ubuntu-latest", "python-version": "3.12"},
          {"os": "ubuntu-latest", "python-version": "3.13"},
          {"os": "ubuntu-latest", "python-version": "3.14"},
          {"os": "windows-latest", "python-version": "3.11"},
          {"os": "windows-latest", "python-version": "3.12"},
          {"os": "windows-latest", "python-version": "3.13"},
          {"os": "windows-latest", "python-version": "3.14"},
          {"os": "macos-latest", "python-version": "3.11"},
          {"os": "macos-latest", "python-version": "3.12"},
          {"os": "macos-latest", "python-version": "3.13"},
          {"os": "macos-latest", "python-version": "3.14"}
          ]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Pin Python version for uv
        run: echo '${{ matrix.python-version }}' > .python-version

      - name: Install cddlib (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcdd-dev

      - name: Install cddlib (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cddlib
          echo "CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Install cddlib (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install cddlib:x64-windows
          echo "INCLUDE=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include;$env:INCLUDE" >> $env:GITHUB_ENV
          echo "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIB" >> $env:GITHUB_ENV

      - name: Install package and dependencies
        run: uv sync --extra test --extra optional

      - name: Run tests
        env:
          COVERAGE_CORE: sysmon
        run: >-
          uv run pytest
          ${{ (matrix.os == 'macos-latest' && matrix.python-version == '3.14') && '--cov-report=xml' || '--no-cov' }}

      - name: Upload coverage
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install cddlib
        run: sudo apt-get update && sudo apt-get install -y libcdd-dev

      - name: Install package
        run: uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install cddlib
        run: sudo apt-get update && sudo apt-get install -y libcdd-dev

      - name: Install package
        run: uv sync --extra dev

      - name: Type check with ty
        run: uv run ty check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra docs

      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
